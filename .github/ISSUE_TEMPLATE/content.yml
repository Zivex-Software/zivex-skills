name: Skill or rule content problem
description: A skill, rule, hook or scanner gives wrong, outdated or risky guidance
labels: [content]
body:
  - type: input
    id: item
    attributes:
      { label: Which skill, rule, hook or scanner rule, placeholder: "aspnet-data-efcore / EF003" }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      {
        label: What is wrong,
        description: Include the official documentation URL that contradicts it,
        or the false positive/negative code sample,
      }
    validations: { required: true }
